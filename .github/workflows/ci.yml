name: CI - OpenProject

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04   # Stable, pas de migration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérification JSON
        run: |
          if [ -f data/opensource-projects.json ]; then
            jq empty data/opensource-projects.json
          else
            echo "Fichier JSON introuvable"
          fi

      - name: Vérification Markdown
        run: |
          echo "README et docs OK"
